---
# Based on https://docs.ansible.com/ansible/latest
# /collections/ansible/builtin/apt_module.html#examples
# Pawelo, 20241129, fix for START name/message
# HAL, 20261003, hold Docker engine packages (upgrade restarted dockerd, homeassistant failed to come back)
# HAL, 20261021, Docker hold removed - live-restore on all Docker hosts keeps containers running across upgrades
# HAL, 20261023, restart docker.sock-mounting containers after a Docker engine upgrade (stale socket with live-restore)

- name: >-
    UPGRADE operation on ALL of the nodes
    (*WARNING* includes reboot if needed, including localhost)
  hosts: all
  become: true
  tasks:
    - name: Gather installed packages
      package_facts:
      tags: docker_sock_restart

    - name: Remember Docker engine package versions before upgrade
      set_fact:
        docker_pkgs_before: "{{ ansible_facts.packages | dict2items | selectattr('key', 'in', ['docker-ce', 'docker-ce-cli', 'containerd.io']) | list }}"
      tags: docker_sock_restart

    # live-restore (/etc/docker/daemon.json) keeps containers running across dockerd restart (patch releases)
    - name: Unhold Docker engine packages (held 2026-10-03..2026-10-21, now upgraded with the rest)
      dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop: [docker-ce, docker-ce-cli, containerd.io]
      when: item in ansible_facts.packages

    - name: Update all repos and perform upgrade to latest versions
      register: upgrade_status
      apt:
        # * upgrade is expecting a string value. In addition to yes and no you can use dist, full, or safe
        upgrade: 'yes'
        update_cache: true
        cache_valid_time: 3600
        # force_apt_get: true
    - name: Show upgrade results
      debug: msg="{{ upgrade_status.stdout_lines }}"
      when: "upgrade_status.stdout.find('0 upgraded, 0 newly installed, 0 to remove and 0 not upgraded.') == -1 \
      and upgrade_status.stdout.find('No packages will be installed, upgraded, or removed.') == -1"

    - name: Gather installed packages after upgrade (Docker hosts only)
      package_facts:
      when: docker_pkgs_before | length > 0
      tags: docker_sock_restart

    # dockerd restart recreates /var/run/docker.sock; with live-restore the containers bind-mounting it
    # (watchtower, portainer, agents) keep the old dead socket -> restart them. Same as runbook x_ubuntu_install_docker.sh
    # test without an upgrade: --tags docker_sock_restart -e force_docker_sock_restart=true
    - name: Restart containers bind-mounting docker.sock if Docker engine packages were upgraded
      register: docker_sock_restart
      shell: !unsafe >-
        for c in $(docker ps -q); do docker inspect "$c" --format '{{.Name}}{{range .Mounts}}{{if eq .Source "/var/run/docker.sock"}} SOCK{{end}}{{end}}'; done
        | awk '/SOCK/{sub("/","",$1); print $1}' | xargs -r docker restart
      changed_when: docker_sock_restart.stdout | length > 0
      when: >-
        docker_pkgs_before | length > 0 and
        (force_docker_sock_restart | default(false) | bool or
        docker_pkgs_before != (ansible_facts.packages | dict2items
        | selectattr('key', 'in', ['docker-ce', 'docker-ce-cli', 'containerd.io']) | list))
      tags: docker_sock_restart

    - name: Show restarted containers
      debug: msg="{{ docker_sock_restart.stdout_lines }}"
      when: docker_sock_restart is changed
      tags: docker_sock_restart

    - name: Check if a reboot is needed
      register: reboot_required_file
      stat: path=/var/run/reboot-required get_checksum=no

    - name: Reboot the box if needed (like kernel updated)
      reboot:
        msg: "Reboot initiated by Ansible for kernel updates"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 10
        post_reboot_delay: 30
        test_command: uptime
      when: reboot_required_file.stat.exists
